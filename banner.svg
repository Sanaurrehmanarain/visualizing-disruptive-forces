<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="paper" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#F7F2E3"/>
      <stop offset="100%" stop-color="#EFE7D2"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>

  <!-- faint baseline ruling, editorial-report texture -->
  <g stroke="#1B2430" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="220" x2="1600" y2="220"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="420" x2="1600" y2="420"/>
    <line x1="0" y1="520" x2="1600" y2="520"/>
    <line x1="0" y1="620" x2="1600" y2="620"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="820" x2="1600" y2="820"/>
  </g>

  <!-- eyebrow -->
  <text x="110" y="100" font-family="'Courier New', monospace" font-size="15" letter-spacing="3" fill="#1B2430" fill-opacity="0.65">FINANCIAL SYSTEMS RESEARCH · 2007–2010</text>
  <line x1="110" y1="118" x2="110" y2="118" stroke="#1B2430"/>

  <!-- title block, left -->
  <text x="108" y="330" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#1B2430" fill-opacity="0.8">Three lenses.</text>
  <text x="105" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#1B2430">Where They</text>
  <text x="105" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="#1B2430">Converge</text>

  <rect x="108" y="540" width="86" height="3" fill="#A63D40"/>

  <text x="108" y="600" font-family="'Courier New', monospace" font-size="18" letter-spacing="0.5" fill="#1B2430" fill-opacity="0.75">Network structure, causal pathways, and strategic</text>
  <text x="108" y="628" font-family="'Courier New', monospace" font-size="18" letter-spacing="0.5" fill="#1B2430" fill-opacity="0.75">behavior in the global banking crisis</text>

  <!-- legend -->
  <g font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#1B2430" fill-opacity="0.75">
    <circle cx="118" cy="710" r="6" fill="#2E7D6B"/>
    <text x="135" y="715">NETWORK CARTOGRAPHY</text>
    <circle cx="118" cy="742" r="6" fill="#C98A2C"/>
    <text x="135" y="747">CAUSAL INFERENCE</text>
    <circle cx="118" cy="774" r="6" fill="#A63D40"/>
    <text x="135" y="779">STRATEGIC-BEHAVIORAL GAME THEORY</text>
  </g>

  <!-- the three overlapping lenses: the report's actual central device -->
  <g>
    <circle cx="1000" cy="360" r="230" fill="#2E7D6B" fill-opacity="0.55"/>
    <circle cx="1220" cy="360" r="230" fill="#C98A2C" fill-opacity="0.55"/>
    <circle cx="1110" cy="555" r="230" fill="#A63D40" fill-opacity="0.55"/>

    <circle cx="1000" cy="360" r="230" fill="none" stroke="#1B2430" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1220" cy="360" r="230" fill="none" stroke="#1B2430" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1110" cy="555" r="230" fill="none" stroke="#1B2430" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- triple-point marker at the true centroid of overlap -->
  <g>
    <line x1="1067" y1="90" x2="1105" y2="415" stroke="#1B2430" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="1105" cy="415" r="5" fill="#1B2430"/>
    <circle cx="1105" cy="415" r="13" fill="none" stroke="#1B2430" stroke-width="1"/>
    <text x="960" y="72" font-family="'Courier New', monospace" font-size="15" letter-spacing="1.5" fill="#1B2430">TRIPLE POINT</text>
    <text x="960" y="92" font-family="'Courier New', monospace" font-size="12" letter-spacing="0.5" fill="#1B2430" fill-opacity="0.65">structural + causal + strategic risk</text>
  </g>

  <!-- fine corner rule, quiet -->
  <line x1="0" y1="899" x2="1600" y2="899" stroke="#1B2430" stroke-opacity="0.15" stroke-width="2"/>
</svg>
